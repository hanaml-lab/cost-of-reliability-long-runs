# TheAgentCompany (175 tasks), as in the report.
agent:
  model: "Qwen/Qwen3-32B"
  mode: "thinking"
  loop: "react"
  step_cap: 100
  trials_per_task: 4

checks:
  artifact: { kind: "deterministic", after: ["edit", "submit"] }
  state_probe: { kind: "environment query", after: "any" }
  critic: { kind: "same-model", model: "Qwen/Qwen3-32B" }

plan:
  default_price: 0.03
  max_retries: 2
  flag_cap: 3

fit:
  dev_runs_per_task: 8
  folds: 5
